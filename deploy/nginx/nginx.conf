# 线上 Nginx 配置
# 部署前把 your-domain.com 替换为已备案域名；证书文件放到 deploy/certs/{zhishu.pem,zhishu.key}
# 通过 Docker 内嵌 DNS 动态解析 backend 服务（10s 刷新），backend 扩缩副本后自动生效。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/zhishu.pem;
    ssl_certificate_key /etc/nginx/certs/zhishu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    set $zhishu_backend backend;

    # 学习助手 SSE：必须关闭缓冲，否则流式回复会整段卡住
    location /api/assistant/chat {
        proxy_pass http://$zhishu_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$zhishu_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康探针（SLB 直连后端时使用；经本 Nginx 也可探测）
    location = /health {
        proxy_pass http://$zhishu_backend:8080/actuator/health;
    }

    # SPA 前端路由
    location / {
        try_files $uri /index.html;
    }
}
