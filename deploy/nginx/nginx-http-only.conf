# 域名/证书就绪前的临时配置：仅 HTTP，经公网 IP 访问。
# 域名审核通过并拿到证书后，active.conf 切指向 nginx.conf。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $zhishu_backend backend;

    location /api/assistant/chat {
        proxy_pass http://$zhishu_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$zhishu_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://$zhishu_backend:8080/actuator/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
