# MinIO 视频存储网关（.38）：S3 API 9000 / 控制台 9001，数据目录为 NAS 共享挂载点
# 用法（在 .38 上）：先 bash mount-nas.sh，复制 .env.example 为 .env 并改密码，docker compose up -d
services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: zhishu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # NAS 共享在主机的挂载点；bucket 为共享内的 zhishu-video 目录
      - ${NAS_HOST_MOUNT:-$HOME/mnt/zhishu}:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
