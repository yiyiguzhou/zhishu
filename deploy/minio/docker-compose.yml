# MinIO 视频存储网关（.38）：S3 API 9000 / 控制台 9001
# 数据目录为网关机本机目录（默认 ~/Documents/YouTube），本地调试不依赖 NAS。
# 用法：复制 .env.example 为 .env，docker compose up -d
services:
  minio:
    # 官方 minio/minio 已停发并下架，使用逐行兼容的社区分支 pgsty/minio（命令/环境变量/磁盘格式一致）
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: zhishu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}          # 至少 3 位
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}  # 至少 8 位
    volumes:
      - ${MINIO_DATA_DIR:-$HOME/Documents/YouTube}:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
