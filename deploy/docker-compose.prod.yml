# 线上编排：Nacos + 后端 + Nginx（Web 静态文件由宿主机目录挂载）
# MySQL 推荐使用阿里云 RDS（内网地址）；确需同机 MySQL 时加 --profile local-mysql。
# 用法：bash scripts/deploy/start.sh（或手动 docker compose -f deploy/docker-compose.prod.yml up -d --build）
name: zhishu-prod

services:
  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: zhishu-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      # 必须 Base64 编码且解码后 >=32 字节，在 .env.prod 中重新生成
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=zhishu
      - NACOS_AUTH_IDENTITY_VALUE=zhishu-nacos-internal
      - JVM_XMS=256m
      - JVM_XMX=512m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: zhishu-backend:prod
    container_name: zhishu-backend
    depends_on:
      - nacos
    env_file:
      - .env.prod
    environment:
      # 容器网络内直连 nacos，覆盖 .env.prod 中面向宿主机的地址
      - NACOS_SERVER_ADDR=nacos:8848
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: zhishu-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # 备选：同机 MySQL（仅在不使用 RDS 时启用：docker compose --profile local-mysql ...）
  mysql:
    image: mysql:8.0
    container_name: zhishu-mysql
    profiles: ["local-mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  nacos-data:
  nacos-logs:
  mysql-data:
