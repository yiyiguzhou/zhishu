# 线上编排：Nacos + 后端（可多副本）+ Redis + Nginx（Web 静态文件由宿主机目录挂载）
#
# profile 说明（COMPOSE_PROFILES，默认 local-nacos,local-redis）：
# - 单机：nacos/redis/mysql 均为本机容器
# - HA：MySQL 用 RDS，Nacos 用 deploy/nacos/docker-compose.cluster.yml 集群或云托管，
#   Redis 用云 Redis；此时 COMPOSE_PROFILES="" 只起 backend+nginx，
#   并在 .env.prod 中把 NACOS_SERVER_ADDR_INTERNAL / REDIS_HOST_INTERNAL 指向云地址
#
# 用法：bash scripts/deploy/start.sh（BACKEND_REPLICAS=N 控制后端副本数）
name: zhishu-prod

services:
  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: zhishu-nacos
    profiles: ["local-nacos"]
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      # 必须 Base64 编码且解码后 >=32 字节，在 .env.prod 中重新生成
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=zhishu
      - NACOS_AUTH_IDENTITY_VALUE=zhishu-nacos-internal
      - JVM_XMS=256m
      - JVM_XMX=256m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zhishu-redis
    profiles: ["local-redis"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: zhishu-backend:prod
    # 不设 container_name：支持 --scale backend=N 起多副本
    env_file:
      - .env.prod
    environment:
      # 容器网络内的默认地址，HA 时在 .env.prod 用 *_INTERNAL 变量改指云服务
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR_INTERNAL:-nacos:8848}
      - REDIS_HOST=${REDIS_HOST_INTERNAL:-redis}
      - REDIS_PORT=${REDIS_PORT_INTERNAL:-6379}
      # 小规格机器限制后端堆大小（容器内默认会按 cgroup 给到 ~450M）
      - JAVA_TOOL_OPTIONS=-Xmx384m -Xms128m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: zhishu-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # 备选：同机 MySQL（仅不使用 RDS 时启用：COMPOSE_PROFILES 加 local-mysql）
  mysql:
    image: mysql:8.0
    container_name: zhishu-mysql
    profiles: ["local-mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/zhishu.cnf:ro
    restart: unless-stopped

volumes:
  nacos-data:
  nacos-logs:
  redis-data:
  mysql-data:
