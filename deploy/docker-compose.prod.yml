# 线上编排：所有应用镜像从阿里云 ACR 拉取（ECS 不构建、不放源码）。
# 镜像由本机执行 scripts/deploy/build-push-acr.sh 推送。
# 中间件（MySQL/Nacos/Redis）当前为同机容器；以后可平滑换成 RDS / 云 Nacos / 云 Redis。
#
# 用法：
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
name: zhishu-prod

services:
  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: zhishu-nacos
    profiles: ["local-nacos"]
    depends_on:
      - mysql
    environment:
      - MODE=standalone
      # 配置/用户信息存 MySQL 的 nacos_config 库（镜像 2.5.4 不内置默认管理员）
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=zhishu
      - NACOS_AUTH_IDENTITY_VALUE=zhishu-nacos-internal
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    volumes:
      - nacos-logs:/home/nacos/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zhishu-redis
    profiles: ["local-redis"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    # 后端镜像（含 jar），从 ACR 拉取；版本标签可在 .env.prod 用 BACKEND_TAG 控制
    image: ${ACR_REGISTRY}/zhishu-ai/backend:${BACKEND_TAG:-latest}
    container_name: zhishu-backend
    env_file:
      - .env.prod
    environment:
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR_INTERNAL:-nacos:8848}
      - REDIS_HOST=${REDIS_HOST_INTERNAL:-redis}
      - REDIS_PORT=${REDIS_PORT_INTERNAL:-6379}
      # 小规格机器限制后端堆
      - JAVA_TOOL_OPTIONS=-Xmx384m -Xms128m
    restart: unless-stopped

  web:
    # Web 镜像（Nginx + 静态文件 + API 反代到 backend）
    image: ${ACR_REGISTRY}/zhishu-ai/web:${WEB_TAG:-latest}
    container_name: zhishu-web
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书目录（域名/证书就绪后启用 HTTPS 配置时使用；HTTP 阶段空目录无影响）
      - ./certs:/etc/nginx/certs
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: zhishu-mysql
    profiles: ["local-mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/zhishu.cnf:ro
    restart: unless-stopped

volumes:
  nacos-logs:
  redis-data:
  mysql-data:
