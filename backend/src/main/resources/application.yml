# 大模型学习平台 - 后端配置
spring:
  application:
    name: zhishu-backend
  profiles:
    active: mysql       # 默认连 192.168.1.38 的 MySQL（数据持久化）；想零依赖内存库可设 SPRING_PROFILES_ACTIVE=h2
  # Nacos 注册发现 + 配置中心（地址/账号支持环境变量覆盖；config.import 用 optional，
  # Nacos 不可用时应用仍能本地启动，仅注册/远程配置失效）
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:192.168.1.38:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        group: ZHISHU_GROUP
        # Nacos 不可用时不阻断应用启动，连接恢复后客户端会自动重新注册
        fail-fast: false
      config:
        group: ZHISHU_GROUP
        file-extension: yaml
  config:
    import:
      - optional:nacos:zhishu-backend.yaml
      - optional:nacos:zhishu-backend-${spring.profiles.active}.yaml

# 业务自定义配置
zhishu:
  jwt:
    # 骨架阶段硬编码密钥占位，生产应从环境变量注入
    secret: "zhishu-skeleton-jwt-secret-please-change-in-prod-0123456789"
    expire-hours: 168
  media:
    # local | minio | nas —— 视频流来源模式（线上 OSS 时扩展 oss）
    mode: minio
    # local 模式：视频根目录
    local-dir: ./media
    # minio 模式：视频存储网关（MinIO 在 192.168.1.38，NAS 由该网关挂载）
    minio:
      endpoint: ${MINIO_ENDPOINT:http://192.168.1.38:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:zhishu-video}
    # nas 模式（备选）：后端本机直挂 NAS 共享
    nas:
      host: ${NAS_IP:192.168.1.2}
      share: ${NAS_SHARE:zhishu-video}
      mount-dir: ${NAS_MOUNT_DIR:${user.home}/mnt/zhishu-video}
  wx:
    # 微信小程序 code2session 占位配置；骨架模式 WX_APPID/SECRET 为空时返回 mock openid
    app-id: ""
    secret: ""

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.zhishu: debug

server:
  port: 8080